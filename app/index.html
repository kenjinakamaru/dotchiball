function toggleExtra(memberId, count) {
  const el  = document.getElementById('extra-' + memberId);
  const btn = document.getElementById('extra-btn-' + memberId);
  if (!el) return;
  const isHidden = el.style.display === 'none';
  el.style.display  = isHidden ? 'block' : 'none';
  btn.textContent   = isHidden ? '折りたたむ ∧' : `他 ${count} 件を表示 ∨`;
  if (isHidden) setTimeout(renderQR, 0);
}

function setTab(tab) {
  curTab = tab;
  curBallId = null;
  if (tab === 'balls')     { curFilter = 'all'; }
  if (tab === 'dashboard') { curProjectId = null; }
  render();
}
function setFilter(f) { curFilter = f; render(); }
function gotoBallsFilter(filterKey) {
  curTab    = 'balls';
  curBallId = null;
  curFilter = filterKey;
  curBallProjectFilter = null;
  render();
  window.scrollTo(0, 0);
}
function viewBall(id) { curBallId = id; render(); window.scrollTo(0,0); }
function goBack() { curBallId = null; render(); }

// ────────────────────────────────────────
// ANIMATIONS & FEEDBACK
// ────────────────────────────────────────
function playThrow(cb) {
  const el = document.getElementById('throw-anim');
  el.classList.remove('hidden');
  setTimeout(() => { el.classList.add('hidden'); cb && cb(); }, 750);
}

let _toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ────────────────────────────────────────
// EVENT LISTENERS
// ────────────────────────────────────────
document.getElementById('btn-new').addEventListener('click', () => {
  if (loading) return;
  if (!state.members.length) {
    toast('先にメンバーを追加してください');
    setTab('members');
    setTimeout(() => showAddMember(), 80);
    return;
  }
  const preProj = (curProjectId && curProjectId !== '__none__') ? curProjectId
    : (curBallProjectFilter && curBallProjectFilter !== '__none__') ? curBallProjectFilter
    : null;
  showCreateModal(null, null, preProj);
});

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    if (loading) return;
    setTab(el.dataset.tab);
  });
});

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) hideModal();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') hideModal(); });

// ────────────────────────────────────────
// EMAIL NOTIFICATION & REMINDER
// ────────────────────────────────────────
emailjs.init(EMAILJS_PUBLIC_KEY);

const REMINDER_KEY = 'dotchiball_reminders_v1';

function loadSentReminders() {
  try { return JSON.parse(localStorage.getItem(REMINDER_KEY) || '{}'); } catch(_) { return {}; }
}

function markReminderSent(ballId) {
  const r = loadSentReminders();
  r[ballId] = new Date().toISOString();
  localStorage.setItem(REMINDER_KEY, JSON.stringify(r));
}

function hasReminderSent(ballId) {
  return !!loadSentReminders()[ballId];
}

function checkReminders() {
  if (localMode || !db) return;
  activeBalls().forEach(ball => {
    if (!ball.dueDate || hasReminderSent(ball.id)) return;
    const mins = minutesUntil(ball.dueDate);
    if (mins !== null && mins >= 0 && mins <= 10) {
      const holder = getMember(ball.currentHolder);
      if (holder && holder.email) {
        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_name:    holder.name,
          email:      holder.email,
          ball_title: ball.title,
          due_date:   fmtDate(ball.dueDate),
          priority:   priLabel(ball.priority),
          note:       '⏰ 期限10分前のリマインダーです',
          ball_url:   generateShareUrl(ball.id) || '',
        }).catch(err => console.warn('リマインダーメール失敗:', err));
        markReminderSent(ball.id);
        toast(`⏰ 「${ball.title}」の期限が10分後です`);
      }
    }
  });
}

setInterval(checkReminders, 60000); // 1分ごとにチェック

function sendEmailNotification(ball, toMember, note) {
  if (localMode) return;
  if (!toMember || !toMember.email) return;
  const url = generateShareUrl(ball.id) || '';
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    to_name:    toMember.name,
    email:      toMember.email,
    ball_title: ball.title,
    due_date:   fmtDate(ball.dueDate),
    priority:   priLabel(ball.priority),
    note:       note || 'なし',
    ball_url:   url,
  }).catch(err => console.warn('メール送信失敗:', err));
}

// ────────────────────────────────────────
// STARTUP
// ────────────────────────────────────────
(function init() {
  const params = new URLSearchParams(window.location.search);
  const urlRoom = params.get('room');
  const urlBall = params.get('ball');

  const setup = loadSetup();
  if (setup && setup.roomCode) {
    // URLにルームコードがあればそれを優先し、保存内容も更新する
    const targetRoom = urlRoom || setup.roomCode;
    if (urlRoom && urlRoom !== setup.roomCode) {
      saveSetup(setup.config, urlRoom);
    }
    try {
      initFirebase(EMBEDDED_CONFIG, targetRoom);
      if (urlBall) _pendingBallId = urlBall;
      hideSetupScreen();
      render(); // shows spinner while listeners load
    } catch(e) {
      console.error('Firebase init failed:', e);
      showSetupScreen();
    }
  } else {
    // セットアップ未完了の場合、URLのルームコードをフォームに自動入力
    if (urlRoom) {
      const inp = document.getElementById('setup-room');
      if (inp) inp.value = urlRoom;
    }
  }
})();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6B35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>どっち!?ボール</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap">
  <style>
    :root {
      --primary: #FF6B35;
      --primary-dark: #E55A24;
      --primary-light: rgba(255,107,53,0.10);
      --success: #16A34A;
      --warning: #FF6B35;
      --danger: #EF4444;
      --danger-dim: #FEF2F2;

      --bg: #F4F6F9;
      --surface: #FFFFFF;
      --surface-2: #F1F5F9;
      --card: #FFFFFF;
      --text: #0B1220;
      --text-light: #64748B;
      --text-mute: #94A3B8;
      --border: #E2E8F0;

      --shadow: 0 1px 2px rgba(15,23,42,0.06);
      --shadow-md: 0 8px 24px rgba(15,23,42,0.10);
      --r: 14px;
      --r-sm: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'YuGothic', sans-serif;
      background: #DDE3EB;
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      font-feature-settings: 'cv11';
    }
    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
      padding-bottom: 80px;
    }
    @media(min-width:480px) { #app { box-shadow: 0 24px 64px rgba(15,23,42,0.18); } }

    /* ── HEADER ── */
    #app-header {
      background: var(--surface);
      color: var(--text);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .header-row { display: flex; align-items: center; justify-content: space-between; }
    .logo {
      display: inline-flex; align-items: center; gap: 10px;
    }
    .logo-ball { height: 36px; width: 36px; object-fit: contain; }
    .logo-name { font-size: 17px; font-weight: 900; letter-spacing: -0.3px; color: var(--primary); }
    .logo-sub { font-size: 10px; color: var(--text-mute); font-weight: 700; display: block; margin-top: 4px; letter-spacing: 1.2px; text-transform: uppercase; }
    .btn-throw {
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-family: 'Russo One', 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1.2px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(255,107,53,0.4);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-throw:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(255,107,53,0.5);
    }
    .btn-throw:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(255,107,53,0.3);
    }

    /* ── CONNECTION BADGE ── */
    #conn-badge {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-mute);
      margin-top: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
    .conn-dot.offline { background: var(--danger); }
    .conn-dot.connecting { background: var(--primary); animation: pulse 1s ease-in-out infinite; }
    /* ── BOTTOM NAV ── */
    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 8px 0 max(10px, env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 0;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-mute);
      transition: color 0.2s;
      font-family: inherit;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 22px; line-height: 1; }
    .nav-label { font-size: 9px; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase; }

    /* ── MAIN CONTENT ── */
    #main-content { padding: 16px 14px 0; }

    /* ── SECTION TITLE ── */
    .sec-title {
      font-size: 10px;
      font-weight: 900;
      color: var(--text-mute);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 22px 4px 10px;
    }
    .sec-title:first-child { margin-top: 4px; }

    /* ── STATS GRID (Scoreboard) ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 10px 12px;
      text-align: center;
    }
    .stat-num {
      font-size: 38px;
      font-weight: 900;
      color: var(--text);
      line-height: 0.95;
      letter-spacing: -1.5px;
      font-feature-settings: 'tnum';
    }
    .stat-lbl {
      font-size: 9px;
      color: var(--text-mute);
      font-weight: 800;
      margin-top: 6px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    .stat-lbl-jp {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-light);
      letter-spacing: 0;
      text-transform: none;
      margin-top: 2px;
    }
    .stat-card.danger { border-color: var(--danger); background: var(--danger-dim); }
    .stat-card.danger .stat-num { color: var(--danger); }
    .stat-card.warn   { border-color: var(--primary); background: var(--primary-light); }
    .stat-card.warn .stat-num   { color: var(--primary); }
    .stat-card.tappable { cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
    .stat-card.tappable:active { transform: scale(0.96); }

    /* ── SOS BANNER ── */
    .sos-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--danger);
      border-left: 4px solid var(--danger);
      border-radius: var(--r);
      padding: 12px 14px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: transform 0.15s;
      box-shadow: 0 2px 10px rgba(239,68,68,0.15);
    }
    .sos-banner:active { transform: scale(0.98); }
    .sos-banner-icon { font-size: 26px; flex-shrink: 0; }
    .sos-banner-body { flex: 1; min-width: 0; }
    .sos-banner-title { font-size: 12px; font-weight: 900; color: var(--danger); letter-spacing: 1.2px; text-transform: uppercase; }
    .sos-banner-sub { font-size: 12px; color: var(--text-light); margin-top: 2px; }
    .sos-banner-chev { font-size: 24px; color: var(--danger); font-weight: 900; }
    .sos-item {
      background: var(--surface);
      border: 1px solid var(--danger);
      border-left: 3px solid var(--danger);
      border-radius: var(--r-sm);
      padding: 12px;
      margin-bottom: 10px;
    }
    .sos-item-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .sos-item-from { font-size: 13px; font-weight: 900; color: var(--danger); letter-spacing: 0.3px; }
    .sos-item-time { font-size: 11px; color: var(--text-mute); font-feature-settings: 'tnum'; }
    .sos-item-ball {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      padding: 6px 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .sos-item-ball.muted { color: var(--text-mute); font-weight: 400; cursor: default; }
    .sos-item-msg { font-size: 13px; color: var(--text-light); margin-top: 4px; }
    .sos-list { max-height: 60vh; overflow-y: auto; margin-bottom: 10px; }

    /* ── BALL CARD ── */
    .ball-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      touch-action: pan-y;
      user-select: none;
      position: relative;
      z-index: 1;
      box-shadow: var(--shadow);
    }
    .ball-card:active { transform: scale(0.98); border-color: var(--text-mute); }
    .ball-card.urgent  { border-color: rgba(239,68,68,0.4); }
    .ball-card.done-card { opacity: 0.55; }

    /* ── SWIPE WRAPPER ── */
    .ball-card-wrap {
      position: relative;
      margin-bottom: 8px;
      border-radius: var(--r);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .ball-card-wrap .ball-card { margin-bottom: 0; box-shadow: none; }
    .swipe-bg {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      display: flex;
      align-items: center;
      font-weight: 900;
      font-size: 16px;
      color: white;
      gap: 8px;
      padding: 0 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 0;
    }
    .swipe-bg-throw {
      left: 0;
      background: var(--primary);
      color: #000;
      justify-content: flex-start;
    }
    .swipe-bg-sos {
      right: 0;
      background: var(--danger);
      justify-content: flex-end;
    }
    /* 閾値超過時の発光 */
    .ball-card-wrap.swipe-armed-right .swipe-bg-throw,
    .ball-card-wrap.swipe-armed-left  .swipe-bg-sos {
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5);
      animation: armedPulse 0.5s ease-in-out infinite;
    }
    @keyframes armedPulse {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.25); }
    }
    /* 上スワイプ閾値超過時 */
    .ball-card-wrap.swipe-armed-up {
      box-shadow: 0 0 0 2px var(--success), 0 4px 18px rgba(34,197,94,0.4);
    }
    .ball-card-wrap.swipe-armed-up::after {
      content: 'Release to Complete';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 2;
    }

    /* ── CARD ROW: urgency + time + priority ── */
    .card-row1 {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px;
    }
    .urg-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .urg-dot.urgent { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .urg-dot.warning { background: var(--primary); }
    .urg-dot.normal { background: #475569; }
    .urg-dot.no-date { background: #2D3748; }
    .card-time {
      font-size: 11px; font-weight: 800;
      color: var(--text-light); font-feature-settings: 'tnum';
      letter-spacing: 0.3px;
    }
    .card-time.urgent { color: var(--danger); }
    .card-time.warning { color: var(--primary); }
    .card-prio {
      margin-left: auto;
      font-size: 10px; font-weight: 900; letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-mute);
    }
    .card-prio.high { color: var(--danger); }
    .card-prio.medium { color: var(--primary); }

    .ball-title {
      font-size: 15px; font-weight: 800; color: var(--text);
      line-height: 1.35;
      letter-spacing: -0.2px;
      margin-bottom: 4px;
    }
    .ball-desc {
      font-size: 12px; color: var(--text-light); line-height: 1.5;
      margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ── HOLDER ROW (Full card only) ── */
    .holder-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .holder-name { font-size: 13px; font-weight: 800; color: var(--text); }

    /* ── SWIPE HINT BAR ── */
    .swipe-hint-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid var(--border);
      color: var(--text-mute);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    .swipe-hint-bar .arr {
      display: inline-flex; align-items: center; gap: 2px;
    }
    .swipe-hint-bar .material-symbols-outlined { font-size: 18px; line-height: 1; }

    /* 旧 badges スタイルは互換のため残す（未使用想定だが安全） */
    .badges { display: none; }

    /* ── AVATAR (Jersey style) ── */
    .av {
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: white;
      flex-shrink: 0;
      font-size: 14px;
      width: 34px;
      height: 34px;
      position: relative;
      background-clip: padding-box;
    }
    .av::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 7px;
      pointer-events: none;
    }
    .av-sm { width: 28px; height: 28px; font-size: 12px; border-radius: 8px; }
    .av-sm::after { inset: 2px; border-radius: 6px; }
    .av-lg { width: 48px; height: 48px; font-size: 18px; border-radius: 12px; }
    .av-lg::after { inset: 4px; border-radius: 8px; }

    /* ── THROW BTN ── */
    .throw-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .throw-btn:active { transform: scale(0.93); background: var(--primary-dark); }

    /* ── PLAYER SECTION (dashboard) ── */
    .player-section {
      margin-bottom: 18px;
    }
    .ps-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .ps-left { display: flex; align-items: center; gap: 12px; }
    .ps-name { font-size: 15px; font-weight: 900; letter-spacing: -0.2px; }
    .ps-meta { font-size: 10px; color: var(--text-mute); font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 2px; }
    .owner-mark { font-size: 11px; margin-left: 2px; }
    .more-btn {
      width: 100%; text-align: center;
      font-size: 10px; font-weight: 900;
      color: var(--text-mute);
      letter-spacing: 1.4px; text-transform: uppercase;
      margin-top: 8px;
      background: none; border: 1px dashed var(--border);
      border-radius: var(--r-sm);
      cursor: pointer; padding: 10px 0;
      font-family: inherit;
      transition: all 0.15s;
    }
    .more-btn:active { background: var(--surface); color: var(--text); }
    .ball-count {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 999px;
      font-feature-settings: 'tnum';
      box-shadow: var(--shadow);
    }

    /* ── FILTER TABS ── */
    .filter-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-bottom: 14px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .ftab {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      font-family: inherit;
      color: var(--text-light);
      letter-spacing: 0.3px;
    }
    .ftab.active { background: var(--primary); border-color: var(--primary); color: #000; }
    .ftab .cnt { background: rgba(0,0,0,0.25); border-radius: 10px; padding: 0 6px; font-size: 10px; font-weight: 900; }
    .ftab:not(.active) .cnt { background: var(--surface-2); color: var(--text-mute); }
    .ftab-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── MODAL ── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    #modal-overlay.hidden { display: none; }
    .modal-sheet {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 92dvh;
      overflow-y: auto;
      padding: 0 16px max(20px, env(safe-area-inset-bottom));
      animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      overscroll-behavior: contain;
      color: var(--text);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 16px; }
    .modal-title { font-size: 18px; font-weight: 900; margin-bottom: 18px; letter-spacing: -0.2px; }

    /* ── FORMS ── */
    .fgroup { margin-bottom: 16px; }
    .flabel {
      display: block;
      font-size: 10px;
      font-weight: 900;
      color: var(--text-mute);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .finput {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
    }
    .finput:focus { border-color: var(--primary); background: var(--surface); }
    .finput:disabled { opacity: 0.45; cursor: not-allowed; background: var(--surface-2); }
    .hint-disabled { color: var(--text-mute); font-weight: 700; margin-left: 6px; text-transform: none; letter-spacing: 0; }
    textarea.finput { resize: none; min-height: 80px; }

    /* Player selector */
    .player-selector { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
    .p-opt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 12px 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all 0.15s;
      background: var(--surface-2);
      font-family: inherit;
      color: var(--text);
    }
    .p-opt.sel { border-color: var(--primary); background: var(--primary-light); }
    .p-opt-name { font-size: 11px; font-weight: 700; color: var(--text); text-align: center; line-height: 1.3; }

    /* Priority selector */
    .pri-row { display: flex; gap: 7px; }
    .pri-opt {
      flex: 1;
      padding: 10px 4px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      text-align: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      transition: all 0.15s;
      background: var(--surface-2);
      font-family: inherit;
      color: var(--text-mute);
    }
    .pri-opt.sel.high   { border-color: var(--danger);  background: var(--danger-dim); color: var(--danger); }
    .pri-opt.sel.medium { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .pri-opt.sel.low    { border-color: var(--text-mute); background: var(--surface); color: var(--text-light); }

    /* Color picker */
    .color-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .cswatch {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cswatch.sel { border-color: var(--text); transform: scale(1.18); box-shadow: 0 0 0 2px var(--bg) inset; }

    /* Submit / secondary buttons */
    .btn-main {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: var(--r-sm);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      margin-top: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .btn-main:active { transform: scale(0.98); background: var(--primary-dark); }
    .btn-main:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-main.green { background: var(--success); }
    .btn-main.red   { background: var(--danger); color: #fff; }
    .btn-sub {
      width: 100%;
      padding: 12px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      margin-top: 6px;
    }
    .btn-sub:active { background: var(--surface); }
    .btn-sub.danger { background: var(--danger-dim); color: var(--danger); border-color: var(--danger); }

    /* ── DETAIL VIEW ── */
    .detail-hero {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px;
      color: var(--text);
      margin: -16px -14px 14px;
    }
    .detail-hero.urg  { border-bottom-color: var(--danger); background: linear-gradient(180deg, rgba(239,68,68,0.10), var(--surface)); }
    .detail-hero.done { border-bottom-color: var(--success); background: linear-gradient(180deg, rgba(34,197,94,0.10), var(--surface)); }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 3px;
      color: var(--text-light);
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-bottom: 10px;
      font-family: inherit;
      padding: 0;
    }
    .detail-title { font-size: 22px; font-weight: 900; line-height: 1.3; margin-bottom: 10px; letter-spacing: -0.3px; }
    .hero-badges { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 800;
      color: var(--text-light);
      letter-spacing: 0.3px;
    }

    /* Info card */
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px;
      margin-bottom: 10px;
    }
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-row:first-child { padding-top: 0; }
    .info-key { font-size: 10px; font-weight: 900; color: var(--text-mute); text-transform: uppercase; letter-spacing: 1.2px; }
    .info-val { font-size: 14px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 6px; }
    .info-val.muted { color: var(--text-mute); font-weight: 500; font-size: 13px; }

    /* ── TIMELINE ── */
    .timeline { position: relative; padding-left: 26px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 12px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: var(--border);
    }
    .tl-item { position: relative; margin-bottom: 12px; }
    .tl-dot {
      position: absolute;
      left: -21px;
      top: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
      border: 2.5px solid var(--bg);
      box-shadow: 0 0 0 2px var(--primary);
    }
    .tl-dot.done-dot { background: var(--success); box-shadow: 0 0 0 2px var(--success); }
    .tl-dot.create-dot { background: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
    .tl-body { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; }
    .tl-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
    .tl-action { font-size: 12px; font-weight: 700; flex: 1; color: var(--text); }
    .tl-time { font-size: 10px; color: var(--text-mute); white-space: nowrap; font-feature-settings: 'tnum'; }
    .tl-note { font-size: 12px; color: var(--text-light); margin-top: 3px; }
    .tl-note a { color: var(--primary); text-decoration: none; font-weight: 700; }
    .tl-note a:hover { text-decoration: underline; }

    /* ── MEMBER CARD ── */
    .member-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mc-info { flex: 1; }
    .mc-name { font-size: 15px; font-weight: 900; letter-spacing: -0.2px; }
    .mc-stat { font-size: 11px; color: var(--text-mute); margin-top: 3px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .mc-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .icon-btn:active { transform: scale(0.9); background: var(--surface); }
    .icon-btn.del { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }
    .member-card.is-owner { border-color: var(--primary); background: var(--surface); }
    .owner-crown { font-size: 14px; margin-left: 4px; }
    .mc-owner-btn {
      margin-top: 8px;
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--surface-2);
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .mc-owner-btn:active { transform: scale(0.95); background: var(--primary-light); }
    .mc-owner-label {
      margin-top: 6px;
      font-size: 10px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 40px 16px; color: var(--text-light); }
    .empty-icon { font-size: 56px; margin-bottom: 14px; opacity: 0.6; }
    .empty-title { font-size: 18px; font-weight: 900; margin-bottom: 8px; color: var(--text); letter-spacing: -0.2px; }
    .empty-text { color: var(--text-mute); font-size: 13px; line-height: 1.7; margin-bottom: 20px; }

    /* ── THROW ANIMATION ── */
    #throw-anim {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,107,53,0.1);
    }
    #throw-anim.hidden { display: none; }
    .ball-fly { width: 72px; height: 72px; object-fit: contain; animation: ballFly 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
    @keyframes ballFly {
      0%   { transform: scale(0.3) rotate(-720deg); opacity: 0; }
      40%  { transform: scale(1.4) rotate(-120deg); opacity: 1; }
      100% { transform: scale(0.2) rotate(180deg) translateY(-120px); opacity: 0; }
    }

    /* ── DONE ANIMATION ── */
    .done-overlay {
      position: fixed;
      inset: 0;
      background: rgba(34,197,94,0.92);
      z-index: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      animation: fadeAway 0.4s 1.6s forwards;
    }
    @keyframes fadeAway { to { opacity: 0; pointer-events: none; } }
    .done-icon { font-size: 80px; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .done-text { font-size: 26px; font-weight: 900; margin-top: 14px; letter-spacing: -0.3px; }
    .done-sub  { font-size: 13px; opacity: 0.85; margin-top: 6px; font-weight: 700; letter-spacing: 0.5px; }
    @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.3px;
      opacity: 0;
      transition: all 0.25s;
      z-index: 600;
      white-space: nowrap;
      pointer-events: none;
      max-width: calc(100% - 32px);
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── PULSE ANIM ── */
    .pulse { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.55; } }

    /* ── DIVIDER ── */
    .divider { height: 1px; background: var(--border); margin: 14px 0; }

    /* ── DIVIDER ── */
    .divider { height: 1px; background: var(--border); margin: 14px 0; }

    /* ── SPINNER ── */
    .spinner-wrap { display: flex; justify-content: center; padding: 60px 0; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── SETUP SCREEN ── */
    #setup-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      color: var(--text);
      z-index: 500;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #setup-screen.hidden { display: none; }
    .setup-inner {
      width: 100%;
      max-width: 480px;
      padding: 32px 20px 40px;
    }
    .setup-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .setup-logo img { height: 56px; width: 56px; object-fit: contain; }
    .setup-logo-name { font-size: 32px; font-weight: 900; color: var(--primary); letter-spacing: -0.8px; }
    .setup-tagline {
      text-align: center;
      font-size: 11px;
      color: var(--text-mute);
      margin-bottom: 28px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 800;
    }
    .setup-step {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 16px;
      margin-bottom: 14px;
    }
    .setup-step-title {
      font-size: 10px;
      font-weight: 900;
      color: var(--text-mute);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin-bottom: 12px;
    }
    .setup-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      margin-bottom: 10px;
    }
    .setup-hint {
      font-size: 12px;
      color: var(--text-light);
      line-height: 1.7;
      margin-bottom: 10px;
    }
    .setup-hint ol { padding-left: 16px; }
    .setup-hint li { margin-bottom: 2px; }
    .room-row { display: flex; gap: 8px; align-items: stretch; }
    .room-row .finput {
      flex: 1;
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .btn-gen {
      padding: 0 14px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 18px;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-gen:active { transform: scale(0.92); background: var(--surface); }
    .setup-divider {
      text-align: center;
      font-size: 11px;
      color: var(--text-mute);
      margin: 6px 0;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
    }
    .setup-rules {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 12px;
      margin-top: 10px;
    }
    .setup-rules-title {
      font-size: 10px;
      font-weight: 900;
      color: var(--text-mute);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }
    .setup-rules pre {
      font-size: 10px;
      color: var(--text-light);
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
      font-family: 'SF Mono', 'Consolas', monospace;
    }

    /* ── QR CARD ── */
    .qr-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 16px 14px 14px;
      margin-bottom: 10px;
      text-align: center;
    }
    .qr-card-title {
      font-size: 10px;
      font-weight: 900;
      color: var(--text-mute);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }
    .qr-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
      padding: 10px;
      background: white;
      border-radius: 8px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
    .qr-wrap img, .qr-wrap canvas {
      border-radius: 4px;
    }
    .qr-room-code {
      font-size: 11px;
      color: var(--text-mute);
      margin-bottom: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
    }
    .qr-room-code strong {
      color: var(--text);
      letter-spacing: 4px;
      font-size: 17px;
      font-weight: 900;
      display: block;
      margin-top: 6px;
    }
    .invite-card { padding: 0; }
    .invite-toggle {
      width: 100%;
      background: none;
      border: none;
      padding: 16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
      color: var(--text);
    }
    .invite-toggle { gap: 10px; }
    .invite-toggle:active { background: var(--surface-2); }
    .invite-plus {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      width: 24px;
      flex-shrink: 0;
      text-align: center;
    }
    .invite-jp {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-mute);
      letter-spacing: 0.3px;
      margin-left: auto;
    }
    .invite-body { padding: 0 14px 14px; }
    .invite-body.hidden { display: none; }

    /* ── SHARE BOX ── */
    .share-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .share-box-label {
      font-size: 10px;
      font-weight: 900;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1.3px;
      margin-bottom: 8px;
    }
    .share-url-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .share-url-text {
      flex: 1;
      font-size: 11px;
      color: var(--text-light);
      font-family: 'SF Mono', 'Consolas', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: var(--bg);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      min-width: 0;
    }
    .share-copy-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .share-copy-btn:active { transform: scale(0.93); background: var(--primary-dark); }

    /* ── PROJECT CARD ── */
    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      border-left: 3px solid;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .project-card:active { transform: scale(0.98); }
    .project-dot { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .project-card-info { flex: 1; min-width: 0; }
    .project-card-name { font-size: 15px; font-weight: 900; color: var(--text); letter-spacing: -0.2px; }
    .project-card-meta { font-size: 11px; color: var(--text-mute); margin-top: 3px; font-weight: 700; letter-spacing: 0.3px; }
    .project-card-count { display: flex; flex-direction: column; align-items: flex-end; }
    .project-card-num { font-size: 26px; font-weight: 900; line-height: 1; font-feature-settings: 'tnum'; }
    .project-card-lbl { font-size: 9px; color: var(--text-mute); font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 2px; }

    /* ── PROJECT DETAIL HEADER ── */
    .project-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid;
    }
    .project-header-info { flex: 1; }
    .project-header-name { font-size: 17px; font-weight: 900; letter-spacing: -0.3px; }
    .project-header-meta { font-size: 11px; color: var(--text-mute); margin-top: 3px; font-weight: 700; letter-spacing: 0.5px; }

    /* ── PROJECT OPTION (form) ── */
    .proj-opt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 6px 8px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all 0.15s;
      background: var(--surface-2);
      font-family: inherit;
    }
    .proj-opt.sel { border-color: var(--primary); background: var(--primary-light); }
    .proj-opt-dot { width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0; }
    .proj-opt-name { font-size: 11px; font-weight: 700; color: var(--text); text-align: center; line-height: 1.3; }
  </style>
</head>

// - 0人 → 配列先頭メンバーを昇格

function migrateOwnerIfNeeded() {
  if (!state.members.length) return;
  const owners = state.members.filter(m => m.isOwner);

  if (owners.length === 1) return; // 正常

  if (owners.length === 0) {
    // 0人: 先頭メンバーを昇格
    const first = state.members[0];
    const updated = { ...first, isOwner: true };
    if (localMode) {
      const idx = state.members.findIndex(m => m.id === first.id);
      if (idx !== -1) state.members[idx] = updated;
      saveState();
    } else {
      fsSet('members', updated);
    }
    return;
  }

  // 2人以上: 配列先頭のオーナーだけ残し、他を降格
  const keep = owners[0];
  owners.slice(1).forEach(o => {
    const demoted = { ...o, isOwner: false };
    if (localMode) {
      const idx = state.members.findIndex(m => m.id === o.id);
      if (idx !== -1) state.members[idx] = demoted;
    } else {
      fsSet('members', demoted);
    }
  });
  if (localMode) saveState();
}

// オーナー変更: 全メンバーを一度の操作で原子的に更新（Firestoreのbatchで0/2人状態を発生させない）
function setOwner(memberId) {
  const target = state.members.find(m => m.id === memberId);
  if (!target) return;

  if (localMode) {
    state.members = state.members.map(m => ({ ...m, isOwner: m.id === memberId }));
    saveState();
    render();
  } else if (db && roomCode) {
    const batch = db.batch();
    const col = db.collection('rooms').doc(roomCode).collection('members');
    state.members.forEach(m => {
      const updated = { ...m, isOwner: m.id === memberId };
      batch.set(col.doc(m.id), updated);
    });
    batch.commit().catch(err => {
      console.error('setOwner batch failed:', err);
      toast('オーナー変更に失敗しました');
    });
  }
  toast(`👑 ${target.name}をオーナーに設定しました`);
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const diff = (new Date(dateStr) - new Date()) / 86400000;
  return Math.ceil(diff);
}

function urgency(ball) {
  if (ball.status !== 'active') return 'done';
  if (!ball.dueDate) return 'no-date';
  const mins = minutesUntil(ball.dueDate);
  if (mins < 0)    return 'urgent';
  if (mins <= 2880) return 'urgent';   // 2日以内
  if (mins <= 10080) return 'warning'; // 7日以内
  return 'normal';
}

function minutesUntil(dateStr) {
  if (!dateStr) return null;
  return (new Date(dateStr) - new Date()) / 60000;
}

function fmtDue(dueDate) {
  if (!dueDate) return '期限なし';
  const mins = minutesUntil(dueDate);
  if (mins < 0) {
    const absMins = Math.abs(Math.round(mins));
    if (absMins < 60) return `${absMins}分超過！`;
    const absHours = Math.floor(absMins / 60);
    if (absHours < 24) return `${absHours}時間超過！`;
    return `${Math.floor(absHours / 24)}日超過！`;
  }
  if (mins <= 10)  return `あと${Math.round(mins)}分！`;
  if (mins <= 60)  return `あと${Math.round(mins)}分`;
  if (mins <= 1440) return `あと${Math.floor(mins/60)}時間`;
  const days = Math.ceil(mins / 1440);
  if (days <= 7) return `あと${days}日`;
  const dt = new Date(dueDate);
  return `${dt.getMonth()+1}/${dt.getDate()}まで`;
}

function fmtDate(dueDate) {
  if (!dueDate) return '未設定';
  const dt = new Date(dueDate);
  const hasTime = dueDate.includes('T') && !dueDate.endsWith('T00:00');
  const base = `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;
  if (!hasTime) return base;
  return `${base} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

function fmtDT(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const linkify = s => {
  const parts = String(s||'').split(/(https?:\/\/[^\s]+)/g);
  return parts.map((p, i) => {
    if (i % 2 === 1) {
      const short = p.length > 30 ? p.slice(0, 27) + '…' : p;
      return `<a href="${esc(p)}" target="_blank" rel="noopener">${esc(short)}</a>`;
    }
    return esc(p);
  }).join('');
};

function fmtDueShort(dueDate) {
  if (!dueDate) return '—';
  const mins = minutesUntil(dueDate);
  if (mins < 0) {
    const absMins = Math.abs(Math.round(mins));
    if (absMins < 60)  return `Over ${absMins}m`;

  if (mins <= 1440) return `${Math.floor(mins/60)}h`;
  return `${Math.ceil(mins/1440)}d`;
}

// FIREBASE SETUP
// ────────────────────────────────────────
function initFirebase(config, room) {
  if (!firebase.apps.length) {
    firebase.initializeApp(config);
  }
  db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  roomCode = room;
  loading = true;
  _loadedMembers  = false;
  _loadedBalls    = false;
  _loadedProjects = false;
  _loadedSOS      = false;
  setupListeners();
  updateConnBadge(null);
  showConnInfo();
}

function setupListeners() {
  const room = db.collection('rooms').doc(roomCode);

  room.collection('members').onSnapshot(snap => {
    state.members = snap.docs.map(d => d.data());
    _loadedMembers = true;
    migrateOwnerIfNeeded();
    checkAllLoaded();
    render();
  }, err => {
    console.error('members listener:', err);
    updateConnBadge(false);
  });

  room.collection('balls').onSnapshot(snap => {
    state.balls = snap.docs.map(d => d.data());
    state.balls.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    _loadedBalls = true;
    checkAllLoaded();
    render();
  }, err => {
    console.error('balls listener:', err);
    updateConnBadge(false);
  });

  room.collection('projects').onSnapshot(snap => {
    state.projects = snap.docs.map(d => d.data());
    state.projects.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    _loadedProjects = true;
    checkAllLoaded();
    render();
  }, err => {
    console.error('projects listener:', err);
    updateConnBadge(false);
  });

  room.collection('sos').onSnapshot(snap => {
    state.sos = snap.docs.map(d => d.data());
    state.sos.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    _loadedSOS = true;
    checkAllLoaded();
    render();
  }, err => {
    console.error('sos listener:', err);
    updateConnBadge(false);
  });
}

function checkAllLoaded() {
  if (_loadedMembers && _loadedBalls && _loadedProjects && _loadedSOS && loading) {
    loading = false;
    updateConnBadge(true);
    if (_pendingBallId) {
      if (getBall(_pendingBallId)) curBallId = _pendingBallId;
      _pendingBallId = null;
    }
  }
}

function updateConnBadge(connected) {
  const badge = document.getElementById('conn-badge');
  const dot   = document.getElementById('conn-dot');
  const text  = document.getElementById('conn-text');
  badge.style.display = 'flex';
  if (connected === null) {
    dot.className = 'conn-dot connecting';
    text.textContent = '接続中...';
  } else if (connected) {
    dot.className = 'conn-dot';
    text.textContent = '接続済み';
  } else {
    dot.className = 'conn-dot offline';
    text.textContent = 'オフライン';
  }
}

function showConnInfo() {
  const rd = document.getElementById('room-display');
  if (rd) { rd.style.display = 'block'; rd.textContent = `ルーム: ${roomCode}  (タップでコピー)`; }
}

function showSetupScreen() {
  document.getElementById('setup-screen').classList.remove('hidden');
}

function hideSetupScreen() {
  document.getElementById('setup-screen').classList.add('hidden');
}

function setupGenRoom() {
  document.getElementById('setup-room').value = generateRoomCode();
}

function generateRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}

function parseFirebaseConfig(str) {
  // まず普通のJSONとして試みる
  try { return JSON.parse(str); } catch(_) {}
  // Firebase consoleからコピーしたJS形式（キーに"なし）も対応
  try {
    const jsonStr = str.replace(/([{,][\s\n\r]*)([a-zA-Z_]\w*)\s*:/g, '$1"$2":');
    return JSON.parse(jsonStr);
  } catch(_) {}
  return null;
}

function doSetup() {
  const room = document.getElementById('setup-room').value.trim().toUpperCase();
  if (!room) { toast('ルームコードを入力してください'); return; }

  try {
    saveSetup(EMBEDDED_CONFIG, room);
    initFirebase(EMBEDDED_CONFIG, room);
    const params = new URLSearchParams(window.location.search);
    const urlRoom = params.get('room');
    const urlBall = params.get('ball');
    if (urlRoom === room && urlBall) _pendingBallId = urlBall;
    hideSetupScreen();
    render();
  } catch(e) {
    console.error(e);
    toast('Firebase初期化に失敗しました: ' + (e.message || e));
  }
}

function useLocalMode() {
  localMode       = true;
  loading         = false;
  _loadedProjects = true;
  _loadedSOS      = true;
  state           = loadLocalState();
  if (!state.sos) state.sos = [];
  hideSetupScreen();
  migrateOwnerIfNeeded();
  render();

function fsSet(col, doc) {
  if (!db) return Promise.resolve();
  return db.collection('rooms').doc(roomCode).collection(col).doc(doc.id).set(doc);
}

function fsDelete(col, id) {
  if (!db) return Promise.resolve();
  return db.collection('rooms').doc(roomCode).collection(col).doc(id).delete();
}

function render() {
  if (loading) {
    document.getElementById('main-content').innerHTML =
      `<div class="spinner-wrap"><div class="spinner"></div></div>`;
    return;
  }

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === curTab);
  });

  const main = document.getElementById('main-content');
  if (curBallId) {
    main.innerHTML = renderDetail(curBallId);
  } else {
    switch (curTab) {
      case 'dashboard': main.innerHTML = renderDashboard(); setTimeout(renderQR, 0); break;
      case 'balls':     main.innerHTML = renderBallsList(); break;
      case 'projects':  main.innerHTML = renderProjects();  break;
      case 'members':   main.innerHTML = renderMembers();   break;
      default:          main.innerHTML = renderDashboard(); setTimeout(renderQR, 0);
    }
  }
  setTimeout(attachSwipeHandlersToCards, 0);
}

    if (noPjBalls.length) {
      h += `<div class="project-card" style="border-left-color:#475569" onclick="drillProject('__none__')">
        <div class="project-dot" style="background:#1F252E">📋</div>
        <div class="project-card-info">
          <div class="project-card-name">プロジェクト未設定</div>
          <div class="project-card-meta">${noPjBalls.length}件のボール</div>
        </div>
        <div class="project-card-count">
          <div class="project-card-num" style="color:#5B6675">${noPjBalls.length}</div>
          <div class="project-card-lbl">ボール</div>
        </div>
      </div>`;
    }

    if (active.length === 0) {
      h += `<div class="empty" style="padding-top:10px">
        <div class="empty-icon">🎉</div>
        <div class="empty-title">ボールなし！</div>
        <div class="empty-text">新しいタスクを投げましょう！</div>
      </div>`;
    }
  } else {
    // プロジェクトなし：メンバー別表示（従来の動作）
    if (active.length === 0) {
      h += `<div class="empty" style="padding-top:10px">
        <div class="empty-icon">🎉</div>
        <div class="empty-title">ボールなし！</div>
        <div class="empty-text">今は誰もボールを持っていません。<br>新しいタスクを投げましょう！</div>
      </div>`;
    } else {
      h += `<div class="sec-title">Active Players · ${active.length} Balls</div>`;
      state.members.forEach(m => {
        const balls = ballsByHolder(m.id);
        if (!balls.length) return;
        const meta = m.isOwner ? `OWNER · ${balls.length} ACTIVE` : `${balls.length} ACTIVE`;
        h += `<div class="player-section">
          <div class="ps-header">
            <div class="ps-left">${avHTML(m)}
              <div>
                <div class="ps-name">${esc(m.name)}${m.isOwner ? ' <span class="owner-mark">👑</span>' : ''}</div>
                <div class="ps-meta">${meta}</div>
              </div>
            </div>
            <div class="ball-count">${balls.length}</div>
          </div>
          ${balls.slice(0,3).map(b => ballCardMini(b)).join('')}
          ${balls.length > 3 ? `
            <div id="extra-${m.id}" style="display:none">${balls.slice(3).map(b => ballCardMini(b)).join('')}</div>
            <button id="extra-btn-${m.id}" onclick="toggleExtra('${m.id}',${balls.length-3})" class="more-btn">
              + ${balls.length-3} More
            </button>` : ''}
        </div>`;
      });
      const unassigned = active.filter(b => !getMember(b.currentHolder));
      if (unassigned.length) {
        h += `<div class="player-section">
          <div class="ps-header">
            <div class="ps-left"><div class="av" style="background:#475569">?</div>
              <div>
                <div class="ps-name">Unassigned</div>
                <div class="ps-meta">${unassigned.length} ACTIVE</div>
              </div>
            </div>
            <div class="ball-count">${unassigned.length}</div>
          </div>
          ${unassigned.map(b => ballCardMini(b)).join('')}
        </div>`;
      }
    }
  }

  return h + renderQRCard();
}

function renderProjectDashboard(projectId) {
  const isNone = projectId === '__none__';
  const pj = isNone ? null : getProject(projectId);
  if (!isNone && !pj) { curProjectId = null; return renderDashboard(); }

  const pjBalls   = isNone ? activeBalls().filter(b => !b.projectId) : ballsByProject(projectId);
  const pjOverdue = pjBalls.filter(b => { const m=minutesUntil(b.dueDate); return m!==null && m<0; });
  const pjSoon    = pjBalls.filter(b => { const m=minutesUntil(b.dueDate); return m!==null && m>=0 && m<=2880; });
  const color     = pj?.color || '#475569';

  let h = `<div class="project-header" style="border-left-color:${color}">
    <div class="project-dot" style="background:${color}22">${isNone ? '📋' : '📁'}</div>
    <div class="project-header-info">
      <div class="project-header-name">${isNone ? 'プロジェクト未設定' : esc(pj.name)}</div>
      <div class="project-header-meta">${pjBalls.length}件 ／ 🔴 ${pjOverdue.length}件超過 ／ ⚡ ${pjSoon.length}件要対応</div>
    </div>
    <button onclick="drillBack()" style="background:none;border:none;font-size:22px;cursor:pointer;padding:4px">✕</button>
  </div>`;

  if (pjBalls.length === 0) {
    h += `<div class="empty">
      <div class="empty-icon">🎉</div>
      <div class="empty-title">ボールなし！</div>
      <div class="empty-text">このプロジェクトにはまだボールがありません。</div>
      ${pj ? `<button class="btn-main" onclick="showCreateModal(null,null,'${pj.id}')" style="max-width:200px">🏐 投げる！</button>` : ''}
    </div>`;
    return h;
  }

  h += `<div class="sec-title">Active Players · ${pjBalls.length} Balls</div>`;
  state.members.forEach(m => {
    const balls = pjBalls.filter(b => b.currentHolder === m.id);
    if (!balls.length) return;
    const meta = m.isOwner ? `OWNER · ${balls.length} ACTIVE` : `${balls.length} ACTIVE`;
    h += `<div class="player-section">
      <div class="ps-header">
        <div class="ps-left">${avHTML(m)}
          <div>
            <div class="ps-name">${esc(m.name)}${m.isOwner ? ' <span class="owner-mark">👑</span>' : ''}</div>
            <div class="ps-meta">${meta}</div>
          </div>
        </div>
        <div class="ball-count">${balls.length}</div>
      </div>
      ${balls.slice(0,3).map(b => ballCardMini(b)).join('')}
      ${balls.length > 3 ? `
        <div id="extra-${m.id}" style="display:none">${balls.slice(3).map(b => ballCardMini(b)).join('')}</div>
        <button id="extra-btn-${m.id}" onclick="toggleExtra('${m.id}',${balls.length-3})" class="more-btn">
          + ${balls.length-3} More
        </button>` : ''}
    </div>`;
  });

  const unassigned = pjBalls.filter(b => !getMember(b.currentHolder));
  if (unassigned.length) {
    h += `<div class="player-section">
      <div class="ps-header">
        <div class="ps-left"><div class="av" style="background:#475569">?</div>
          <div>
            <div class="ps-name">Unassigned</div>
            <div class="ps-meta">${unassigned.length} ACTIVE</div>
          </div>
        </div>
        <div class="ball-count">${unassigned.length}</div>
      </div>
      ${unassigned.map(b => ballCardMini(b)).join('')}
    </div>`;
  }

  return h;
}

function drillProject(pid) { curProjectId = pid; render(); window.scrollTo(0, 0); }
function drillBack()        { curProjectId = null; render(); window.scrollTo(0, 0); }

function swipeWrap(inner, ballId, isDone) {
  if (isDone) return inner;
  return `<div class="ball-card-wrap">
    <div class="swipe-bg swipe-bg-throw">Pass</div>
    <div class="swipe-bg swipe-bg-sos">SOS</div>
    ${inner}
  </div>`;
}

function swipeHintBar() {
  return `<div class="swipe-hint-bar">
    <span class="arr"><span class="material-symbols-outlined">chevron_left</span>SOS</span>
    <span class="arr">Complete<span class="material-symbols-outlined">expand_less</span></span>
    <span class="arr">Pass<span class="material-symbols-outlined">chevron_right</span></span>
  </div>`;
}

function ballCardMini(ball) {
  const urg = urgency(ball);
  return swipeWrap(`<div class="ball-card ${urg}" data-ball-id="${ball.id}" onclick="viewBall('${ball.id}')">
    <div class="card-row1">
      <div class="urg-dot ${urg}"></div>
      <div class="card-time ${urg}">${fmtDueShort(ball.dueDate)}</div>
      <div class="card-prio ${ball.priority}">${prioShort(ball.priority)}</div>
    </div>
    <div class="ball-title">${esc(ball.title)}</div>
    ${ball.description ? `<div class="ball-desc">${esc(ball.description)}</div>` : ''}
    ${swipeHintBar()}
  </div>`, ball.id, false);
}

// ────────────────────────────────────────
// BALLS LIST
// ────────────────────────────────────────
function renderBallsList() {
  const allActive = activeBalls();
  const allDone   = state.balls.filter(b => b.status === 'done');

  // プロジェクトフィルタータブ
  let h = '';
  if (state.projects.length > 0) {
    h += `<div class="filter-tabs">
      <button class="ftab ${curBallProjectFilter===null?'active':''}" onclick="setBallProjectFilter(null)">
        📁 全PJ<span class="cnt">${allActive.length}</span>
      </button>`;
    state.projects.forEach(pj => {
      const cnt = ballsByProject(pj.id).length;
      h += `<button class="ftab ${curBallProjectFilter===pj.id?'active':''}" onclick="setBallProjectFilter('${pj.id}')">
        <div class="ftab-dot" style="background:${pj.color}"></div>
        ${esc(pj.name)}<span class="cnt">${cnt}</span>
      </button>`;
    });
    const noCnt = allActive.filter(b => !b.projectId).length;
    if (noCnt > 0) {
      h += `<button class="ftab ${curBallProjectFilter==='__none__'?'active':''}" onclick="setBallProjectFilter('__none__')">
        未設定<span class="cnt">${noCnt}</span>
      </button>`;
    }
    h += `</div>`;
  }

  // プロジェクトで絞り込み
  const active = curBallProjectFilter === null    ? allActive
    : curBallProjectFilter === '__none__' ? allActive.filter(b => !b.projectId)
    : allActive.filter(b => b.projectId === curBallProjectFilter);
  const done = curBallProjectFilter === null    ? allDone
    : curBallProjectFilter === '__none__' ? allDone.filter(b => !b.projectId)
    : allDone.filter(b => b.projectId === curBallProjectFilter);

  let filtered = curFilter === 'done' ? done
    : curFilter === 'all' ? active
    : curFilter === 'overdue' ? active.filter(b => { const m=minutesUntil(b.dueDate); return m!==null && m<0; })
    : curFilter === 'soon'    ? active.filter(b => { const m=minutesUntil(b.dueDate); return m!==null && m>=0 && m<=2880; })
    : active.filter(b => b.currentHolder === curFilter);

  const uOrder = { urgent:0, warning:1, normal:2, 'no-date':3, done:4 };
  filtered = [...filtered].sort((a,b) => (uOrder[urgency(a)]||0) - (uOrder[urgency(b)]||0));

  const overdueCnt = active.filter(b => { const m=minutesUntil(b.dueDate); return m!==null && m<0; }).length;
  const soonCnt    = active.filter(b => { const m=minutesUntil(b.dueDate); return m!==null && m>=0 && m<=2880; }).length;
  const tabs = [
    { key:'all', label:'全て', count: active.length },
    ...(curFilter === 'overdue' || overdueCnt > 0 ? [{ key:'overdue', label:'🔴 期限超過', count: overdueCnt }] : []),
    ...(curFilter === 'soon'    || soonCnt    > 0 ? [{ key:'soon',    label:'⚡ 要対応',  count: soonCnt    }] : []),
    ...state.members.map(m => ({ key:m.id, label:m.name, count: active.filter(b=>b.currentHolder===m.id).length, color: m.color })),
    { key:'done', label:'完了', count: done.length },
  ];

  h += `<div class="filter-tabs">`;
  tabs.forEach(t => {
    h += `<button class="ftab ${curFilter===t.key?'active':''}" onclick="setFilter('${t.key}')">
      ${t.color ? `<div class="ftab-dot" style="background:${t.color}"></div>` : ''}
      ${esc(t.label)}<span class="cnt">${t.count}</span>
    </button>`;
  });
  h += `</div>`;

  if (!filtered.length) {
    const preProj = (curBallProjectFilter && curBallProjectFilter !== '__none__') ? `'${curBallProjectFilter}'` : 'null';
    const isSpecial = curFilter==='overdue' || curFilter==='soon';
    const icon =
      curFilter==='done' ? '✅' :
      curFilter==='overdue' ? '🎉' :
      curFilter==='soon' ? '👍' :
      curFilter==='all' ? '🎉' : '😊';
    const title =
      curFilter==='done' ? '完了ボールなし' :
      curFilter==='overdue' ? '期限超過のボールなし！' :
      curFilter==='soon' ? '要対応のボールなし！' :
      curFilter==='all' ? 'ボールなし！' :
      `${esc(getMember(curFilter)?.name??'')}さんはボールなし`;
    const text =
      curFilter==='overdue' ? '期限超過のタスクはありません 🎊' :
      curFilter==='soon' ? '48時間以内に期限を迎えるタスクはありません' :
      curFilter==='all' ? '新しいボールを投げましょう！' :
      'このメンバーはフリーです！';
    const presetHolder = (curFilter==='all' || isSpecial) ? '' : curFilter;
    h += `<div class="empty">
      <div class="empty-icon">${icon}</div>
      <div class="empty-title">${title}</div>
      <div class="empty-text">${text}</div>
      ${curFilter!=='done'?`<button class="btn-main" onclick="showCreateModal(null,'${presetHolder}',${preProj})" style="max-width:200px">🏐 投げる！</button>`:''}
    </div>`;
    return h;
  }

  filtered.forEach(b => { h += ballCardFull(b); });
  return h;
}

function setBallProjectFilter(pid) { curBallProjectFilter = pid; curFilter = 'all'; render(); }

function ballCardFull(ball) {
  const urg    = urgency(ball);
  const holder = getMember(ball.currentHolder);
  const isDone = ball.status === 'done';
  return swipeWrap(`<div class="ball-card ${urg} ${isDone?'done-card':''}" data-ball-id="${ball.id}" onclick="viewBall('${ball.id}')">
    <div class="card-row1">
      <div class="urg-dot ${urg}"></div>
      <div class="card-time ${urg}">${isDone ? 'Done' : fmtDueShort(ball.dueDate)}</div>
      <div class="card-prio ${ball.priority}">${prioShort(ball.priority)}</div>
    </div>
    <div class="ball-title" style="${isDone?'text-decoration:line-through':''}">${esc(ball.title)}</div>
    ${ball.description ? `<div class="ball-desc">${esc(ball.description)}</div>` : ''}
    <div class="holder-row" style="margin-top:10px;margin-bottom:0">${avHTML(holder,'sm')}<span class="holder-name">${holder?esc(holder.name):'Unassigned'}</span></div>
    ${isDone ? '' : swipeHintBar()}
  </div>`, ball.id, isDone);
}

// ────────────────────────────────────────
// BALL DETAIL
// ────────────────────────────────────────
function renderDetail(ballId) {
  const ball = getBall(ballId);
  if (!ball) { curBallId = null; return renderDashboard(); }

  const holder = getMember(ball.currentHolder);
  const urg    = urgency(ball);
  const isDone = ball.status === 'done';
  const heroCls = isDone ? 'done' : urg === 'urgent' ? 'urg' : '';

  let h = `<div class="detail-hero ${heroCls}">
    <button class="back-btn" onclick="goBack()">← 戻る</button>
    <div class="detail-title">${esc(ball.title)}</div>
    <div class="hero-badges">
      <span class="hero-badge">${isDone ? '✅ 完了' : '🏐 進行中'}</span>
      <span class="hero-badge">${fmtDue(ball.dueDate)}</span>
      <span class="hero-badge">${priLabel(ball.priority)}</span>
    </div>
  </div>`;

  h += `<div class="info-card">`;
  const ballProject = getProject(ball.projectId);
  h += `<div class="info-row"><span class="info-key">プロジェクト</span><span class="info-val">${
    ballProject
      ? `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:${ballProject.color};flex-shrink:0"></span>${esc(ballProject.name)}</span>`
      : '<span style="color:var(--text-light);font-weight:400;font-size:13px">未設定</span>'
  }</span></div>`;
  if (ball.description) {
    h += `<div class="info-row"><span class="info-key">説明</span><span class="info-val muted">${esc(ball.description)}</span></div>`;
  }
  h += `
    <div class="info-row">
      <span class="info-key">担当者</span>
      <span class="info-val">${avHTML(holder,'sm')} ${holder ? esc(holder.name) : '未割当'}</span>
    </div>
    <div class="info-row">
      <span class="info-key">期限</span>
      <span class="info-val">${fmtDate(ball.dueDate)}</span>
    </div>
    <div class="info-row">
      <span class="info-key">作成日</span>
      <span class="info-val">${fmtDT(ball.createdAt)}</span>
    </div>
    <div class="info-row">
      <span class="info-key">パス回数</span>
      <span class="info-val">${ball.history.filter(h=>h.type==='throw').length} 回</span>
    </div>
  </div>`;

  const shareUrl = generateShareUrl(ball.id);
  if (shareUrl) {
    h += `<div class="share-box">
      <div class="share-box-label">🔗 このタスクを共有</div>
      <div class="share-url-row">
        <div class="share-url-text">${esc(shareUrl)}</div>
        <button class="share-copy-btn" onclick="copyShareUrl('${ball.id}')">コピー</button>
      </div>
    </div>`;
  }

  if (!isDone) {
    h += `<button class="btn-main" onclick="showThrowModal('${ball.id}')">➤ 別のメンバーに投げる</button>
      <button class="btn-main green" onclick="completeBall('${ball.id}')">✅ このボールを完了する</button>`;
  } else {
    h += `<button class="btn-sub" onclick="reopenBall('${ball.id}')">🔄 再オープンする</button>`;
  }
  h += `<button class="btn-sub danger" onclick="confirmDelete('${ball.id}')">🗑 削除する</button>`;

  h += `<div class="sec-title">パス履歴</div><div class="timeline">`;
  const hist = [...ball.history].reverse();
  hist.forEach(ev => {
    const from = getMember(ev.from);
    const to   = getMember(ev.to);
    let action = '';
    let dotCls = '';
    if (ev.type === 'create') {
      action = `🆕 <strong>${to ? esc(to.name) : '?'}</strong> が受け取り`;
      dotCls = 'create-dot';
    } else if (ev.type === 'throw') {
      action = `➤ <strong>${from ? esc(from.name) : '?'}</strong> → <strong>${to ? esc(to.name) : '?'}</strong>`;
    } else if (ev.type === 'done') {
      action = `✅ <strong>${from ? esc(from.name) : '?'}</strong> が完了！`;
      dotCls = 'done-dot';
    } else if (ev.type === 'reopen') {
      action = `🔄 再オープン`;
    }
    h += `<div class="tl-item">
      <div class="tl-dot ${dotCls}"></div>
      <div class="tl-body">
        <div class="tl-head"><span class="tl-action">${action}</span><span class="tl-time">${fmtDT(ev.timestamp)}</span></div>
        ${ev.note ? `<div class="tl-note">💬 "${linkify(ev.note)}"</div>` : ''}
      </div>
    </div>`;
  });
  h += `</div>`;

  return h;
}

function renderMembers() {
  let h = `<button class="btn-main" onclick="showAddMember()" style="margin-bottom:14px">＋ Add Player</button>`;

      <div class="empty-text">チームメンバーを追加して<br>タスクを割り当てましょう！</div>

      </div>

        <button class="icon-btn" onclick="showAddMember('${m.id}')">✏️</button>
        <button class="icon-btn del" onclick="confirmDeleteMember('${m.id}')">🗑</button>

// ── CREATE BALL ──
function showCreateModal(defaultHolderId = null, preHolder = null, preProjectId = null) {
  const holderId  = preHolder || defaultHolderId || '';
  const projectId = preProjectId || '';

  const memberOpts = state.members.map(m =>
    `<button class="p-opt ${holderId===m.id?'sel':''}" onclick="selPlayer(this,'${m.id}')" data-pid="${m.id}">
      ${avHTML(m)} <span class="p-opt-name">${esc(m.name)}</span>
    </button>`).join('');

// ACTIONS
// ────────────────────────────────────────
function doCreateBall() {
  const title     = document.getElementById('f-title')?.value.trim();
  const desc      = document.getElementById('f-desc')?.value.trim();
  const holder    = document.getElementById('f-holder')?.value;
  const due       = document.getElementById('f-due')?.value;
  const pri       = document.getElementById('f-pri')?.value || 'medium';
  const note      = document.getElementById('f-note')?.value.trim();
  const projectId = document.getElementById('f-project')?.value || null;

  if (!title)  { toast('タスク名を入力してください'); document.getElementById('f-title')?.focus(); return; }
  if (!holder) { toast('投げる相手を選んでください'); return; }

  const now  = new Date().toISOString();
  const ball = {
    id: uid(), title, description: desc||'',
    currentHolder: holder, dueDate: due||null, priority: pri,
    status: 'active', createdAt: now,
    projectId: projectId || null,
    history: [{ id:uid(), from:null, to:holder, timestamp:now, note:note||'', type:'create' }]
  };

  if (localMode) {
    state.balls.unshift(ball);
    saveState();
  } else {
    fsSet('balls', ball);
  }

  hideModal();
  const m = getMember(holder);
  sendEmailNotification(ball, m, note);
  playThrow(() => {
    toast(`🏐 ${m?esc(m.name):'誰か'}にボールを投げました！`);
    if (localMode) render();
  });
}

function doThrowBall(ballId) {
  const newHolder = document.getElementById('f-throwto')?.value;
  const note      = document.getElementById('f-note')?.value.trim();
  const ball      = getBall(ballId);
  if (!ball) return;
  if (!newHolder) { toast('投げる相手を選んでください'); return; }

  const updatedBall = {
    ...ball,
    currentHolder: newHolder,
    history: [...ball.history, { id:uid(), from:ball.currentHolder, to:newHolder, timestamp:new Date().toISOString(), note:note||'', type:'throw' }]
  };

  if (localMode) {
    const idx = state.balls.findIndex(b => b.id === ballId);
    if (idx !== -1) state.balls[idx] = updatedBall;
    saveState();
  } else {
    fsSet('balls', updatedBall);
  }

  hideModal();
  const m = getMember(newHolder);
  sendEmailNotification(updatedBall, m, note);
  playThrow(() => {
    toast(`➤ ${m?esc(m.name):'誰か'}にパスしました！`);
    if (localMode) render();
  });
}

function completeBall(ballId) {
  const ball = getBall(ballId);
  if (!ball) return;

  const updatedBall = {
    ...ball,
    status: 'done',
    history: [...ball.history, { id:uid(), from:ball.currentHolder, to:ball.currentHolder, timestamp:new Date().toISOString(), note:'', type:'done' }]
  };

  if (localMode) {
    const idx = state.balls.findIndex(b => b.id === ballId);
    if (idx !== -1) state.balls[idx] = updatedBall;
    saveState();
  } else {
    fsSet('balls', updatedBall);
  }

  const overlay = document.createElement('div');
  overlay.className = 'done-overlay';
  overlay.innerHTML = `<div class="done-icon">🎉</div><div class="done-text">完了！</div><div class="done-sub">お疲れさまでした！</div>`;
  document.body.appendChild(overlay);

  setTimeout(() => {
    overlay.remove();
    curBallId = null;
    curTab    = 'dashboard';
    toast('✅ ボールを完了しました！');
    render();
  }, 1900);
}

function reopenBall(ballId) {
  const ball = getBall(ballId);
  if (!ball) return;

  const updatedBall = {
    ...ball,
    status: 'active',
    history: [...ball.history, { id:uid(), from:null, to:ball.currentHolder, timestamp:new Date().toISOString(), note:'', type:'reopen' }]
  };

  if (localMode) {
    const idx = state.balls.findIndex(b => b.id === ballId);
    if (idx !== -1) state.balls[idx] = updatedBall;
    saveState();
    render();
  } else {
    fsSet('balls', updatedBall);
  }

  toast('🔄 再オープンしました');
}

function doDeleteBall(ballId) {

  if (localMode) {
    state.balls = state.balls.filter(b => b.id !== ballId);

function doDeleteMember(memberId) {
  const wasOwner = getMember(memberId)?.isOwner;
  if (localMode) {
    state.members = state.members.filter(m => m.id !== memberId);
    if (wasOwner && state.members.length) {
      state.members[0] = { ...state.members[0], isOwner: true };

        if (remaining.length) {
          fsSet('members', { ...remaining[0], isOwner: true });

  toast('🗑 メンバーを削除しました');

  if (localMode) {

      fsSet('balls', { ...b, projectId: null });
    });

  hideModal();
  toast('🗑 プロジェクトを削除しました');
}

// ────────────────────────────────────────
// SWIPE GESTURES
// ────────────────────────────────────────
function attachSwipe(el, { onSwipeUp, onSwipeRight, onSwipeLeft }) {
  if (el._swipeAttached) return;
  el._swipeAttached = true;

  let startX = 0, startY = 0;
  let dx = 0, dy = 0;
  let hLocked = false, vLocked = false;
  const H_THRESHOLD = 70;
  const V_THRESHOLD = 55;
  const LOCK_PX = 8;

  const resetArmed = () => {
    const wrap = el.closest('.ball-card-wrap');
    if (wrap) wrap.classList.remove('swipe-armed-right', 'swipe-armed-left', 'swipe-armed-up');
  };

  el.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    dx = 0; dy = 0;
    hLocked = false; vLocked = false;
    el.style.transition = 'none';
  }, { passive: true });

  el.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) return;
    const t = e.touches[0];
    dx = t.clientX - startX;
    dy = t.clientY - startY;

    if (!hLocked && !vLocked) {
      // 水平に動いたら hLock、明確に上方向(20px以上)なら vLock
      if (Math.abs(dx) > Math.abs(dy) + LOCK_PX && Math.abs(dx) > 10) {
        hLocked = true;
      } else if (dy < -20 && Math.abs(dy) > Math.abs(dx) + LOCK_PX) {
        vLocked = true;
      }
    }

    const wrap = el.closest('.ball-card-wrap');

    if (hLocked) {
      e.preventDefault();
      el.style.transform = `translateX(${dx}px)`;
      if (wrap) {
        const past = Math.abs(dx) > H_THRESHOLD;
        wrap.classList.toggle('swipe-armed-right', past && dx > 0);
        wrap.classList.toggle('swipe-armed-left',  past && dx < 0);
      }
    } else if (vLocked) {
      e.preventDefault();
      // 上スワイプは抵抗感を出すため移動量の70%
      const visualDy = dy * 0.7;
      el.style.transform = `translateY(${visualDy}px)`;
      el.style.opacity = `${1 - Math.min(Math.abs(dy) / 180, 0.5)}`;
      if (wrap) wrap.classList.toggle('swipe-armed-up', dy < -V_THRESHOLD);
    }
  }, { passive: false });

  el.addEventListener('touchend', () => {
    let triggered = false;

    if (hLocked && Math.abs(dx) > H_THRESHOLD) {
      triggered = true;
      if (dx > 0 && onSwipeRight) onSwipeRight();
      else if (dx < 0 && onSwipeLeft) onSwipeLeft();
    } else if (vLocked && dy < -V_THRESHOLD && onSwipeUp) {
      triggered = true;
      onSwipeUp();
    }

    el.style.transition = 'transform 0.2s, opacity 0.2s';
    el.style.transform = '';
    el.style.opacity = '';
    resetArmed();

    if (triggered) {
      const cancelClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
      el.addEventListener('click', cancelClick, true);
      setTimeout(() => el.removeEventListener('click', cancelClick, true), 400);
    }
  }, { passive: true });

  el.addEventListener('touchcancel', () => {
    el.style.transition = 'transform 0.2s, opacity 0.2s';
    el.style.transform = '';
    el.style.opacity = '';
    resetArmed();
  });
}

function attachSwipeHandlersToCards() {
  document.querySelectorAll('.ball-card[data-ball-id]').forEach(el => {
    const id = el.dataset.ballId;
    const ball = getBall(id);
    if (!ball || ball.status === 'done') return;
    attachSwipe(el, {
      onSwipeUp:    () => completeBall(id),
      onSwipeRight: () => showThrowModal(id),
      onSwipeLeft:  () => showSOSConfirm(id),
    });
  });
}

// SOS
// ────────────────────────────────────────
function renderSOSBanner() {
  const list = openSOS();
  if (!list.length) return '';
  const owner = getOwner();
  return `<div class="sos-banner" onclick="showSOSList()">
    <div class="sos-banner-icon">🆘</div>
    <div class="sos-banner-body">
      <div class="sos-banner-title">SOS ${list.length}件</div>
      <div class="sos-banner-sub">${owner ? `${esc(owner.name)}さん、` : ''}ヘルプ要請が届いています（タップで確認）</div>
    </div>
    <div class="sos-banner-chev">›</div>
  </div>`;
}

function sendSOS(ballId = null, message = '') {
  const ball  = ballId ? getBall(ballId) : null;
  const owner = getOwner();
  const sos = {
    id: uid(),
    ballId: ballId || null,
    ballTitle: ball ? ball.title : '',
    fromMemberId: ball?.currentHolder || null,
    fromName: ball ? (getMember(ball.currentHolder)?.name || '') : '',
    message: message || '',
    createdAt: new Date().toISOString(),
    resolved: false,
    resolvedAt: null,
  };

  if (localMode) {
    state.sos = state.sos || [];
    state.sos.unshift(sos);
    saveState();
    render();
  } else {
    fsSet('sos', sos);
  }

  // オーナーにメール通知（ローカルモードでは送らない）
  if (!localMode && owner && owner.email) {
    const url = ball ? (generateShareUrl(ball.id) || '') : '';
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_name:    owner.name,
      email:      owner.email,
      ball_title: ball ? `[SOS] ${ball.title}` : '[SOS] ヘルプ要請',
      due_date:   ball ? fmtDate(ball.dueDate) : '-',
      priority:   '🆘 SOS',
      note:       (sos.fromName ? `${sos.fromName}さんから: ` : '') + (message || 'ヘルプ要請が届いています'),
      ball_url:   url,
    }).catch(err => console.warn('SOSメール送信失敗:', err));
  }

  toast(`🆘 オーナー(${owner?.name || '未設定'})にSOSを送りました`);
}

function resolveSOS(sosId) {
  const s = (state.sos || []).find(x => x.id === sosId);
  if (!s) return;
  const updated = { ...s, resolved: true, resolvedAt: new Date().toISOString() };
  if (localMode) {
    const idx = state.sos.findIndex(x => x.id === sosId);
    if (idx !== -1) state.sos[idx] = updated;
    saveState();
    render();
  } else {
    fsSet('sos', updated);
  }
  toast('✅ SOSを対応済みにしました');
}

function showSOSList() {
  const list = openSOS();
  if (!list.length) {
    showModal(`
      <div class="modal-title">🆘 SOS一覧</div>
      <div class="empty" style="padding:20px 0">
        <div class="empty-icon">👍</div>
        <div class="empty-text">未対応のSOSはありません</div>
      </div>
      <button class="btn-sub" onclick="hideModal()">閉じる</button>
    `);
    return;
  }
  let body = list.map(s => {
    const ball = s.ballId ? getBall(s.ballId) : null;
    return `<div class="sos-item">
      <div class="sos-item-head">
        <span class="sos-item-from">${esc(s.fromName || '不明')}</span>
        <span class="sos-item-time">${fmtDT(s.createdAt)}</span>
      </div>
      ${ball ? `<div class="sos-item-ball" onclick="hideModal();viewBall('${ball.id}')">📌 ${esc(ball.title)}</div>` : '<div class="sos-item-ball muted">（タスク指定なし）</div>'}
      ${s.message ? `<div class="sos-item-msg">💬 ${esc(s.message)}</div>` : ''}
      <button class="btn-sub" style="margin-top:8px" onclick="resolveSOS('${s.id}')">✅ 対応済みにする</button>
    </div>`;
  }).join('');
  showModal(`
    <div class="modal-title">🆘 SOS一覧（${list.length}件）</div>
    <div class="sos-list">${body}</div>
    <button class="btn-sub" onclick="hideModal()">閉じる</button>
  `);
}

function showSOSConfirm(ballId = null) {
  const ball = ballId ? getBall(ballId) : null;
  const owner = getOwner();
  if (!owner) { toast('オーナーが設定されていません'); return; }
  showModal(`
    <div class="modal-title">🆘 SOSを送る</div>
    <div style="font-size:14px;color:var(--text-light);margin-bottom:14px;line-height:1.6">
      ${ball ? `「${esc(ball.title)}」について<br>` : ''}
      オーナーの<strong>${esc(owner.name)}</strong>さんにヘルプ要請を送ります。
    </div>
    <div class="fgroup">
      <label class="flabel">メッセージ（任意）</label>
      <input class="finput" id="f-sos-msg" type="text" placeholder="例: 期限に間に合いそうにありません" maxlength="200" autocomplete="off">
    </div>
    <button class="btn-main red" onclick="doSendSOS(${ballId ? `'${ballId}'` : 'null'})">🆘 送信する</button>
    <button class="btn-sub" onclick="hideModal()">キャンセル</button>
  `);
  setTimeout(() => document.getElementById('f-sos-msg')?.focus(), 120);
}

function doSendSOS(ballId) {
  const msg = document.getElementById('f-sos-msg')?.value.trim() || '';
  hideModal();
  sendSOS(ballId || null, msg);
}

// ────────────────────────────────────────
// NAVIGATION

function showStatsHelp() {
  showModal(`
    <div class="modal-title">📊 数値の見かた</div>
    <div class="info-card" style="margin-bottom:10px">
      <div class="info-row">

      </div>

      </div>
      <div class="info-row">
        <span class="info-key" style="color:#D97706">⚡ 要対応</span>
        <span class="info-val muted" style="text-align:right;font-size:13px">期限まで48時間以内のタスク数</span>
